
{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
    <h1 class="mb-4">Editar cliente</h1>

    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}

                {% for field in form %}
                <div class="mb-3">
                    <label class="form-label" for="{{ field.id_for_label }}">
                        {{ field.label }}
                    </label>
                    {{ field }}

                    {% for error in field.errors %}
                    <div class="text-danger small">
                        {{ error }}
                    </div>
                    {% endfor %}
                </div>
                {% endfor %}

                <div class="d-flex gap-2">
                    <button class="btn btn-primary" type="submit">
                        Guardar cambios
                    </button>

                    <a href="{% url 'clientes_crear' %}"
                       class="btn btn-secondary">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
